backend:
  name: github
  repo: angusvardywhite/cordelia-bridal-studio
  branch: main
  base_url: https://bread-and-bean-auth.angusvardywhite.workers.dev
  auth_endpoint: /auth
  site_domain: cordeliabridalstudio.com
  commit_messages:
    create: "Content: create {{collection}} {{slug}}"
    update: "Content: update {{collection}} {{slug}}"
    delete: "Content: remove {{collection}} {{slug}}"
    uploadMedia: "Content: add image {{path}}"
    deleteMedia: "Content: remove image {{path}}"

local_backend: true
site_url: https://cordeliabridalstudio.com
display_url: https://cordeliabridalstudio.com
logo_url: /assets/brand/cordelia-logo-black.png
media_folder: public/assets/uploads
public_folder: /assets/uploads

collections:
  - name: pages
    label: Website
    files:
      - name: home
        label: Home page
        file: public/content/site.json
        format: json
        fields:
          - { label: "First image beside the main heading", name: hero_image, widget: image, required: false, hint: "This controls the large first image at the top of the website." }
          - { label: Main heading, name: hero_heading, widget: string }
          - { label: Intro text, name: hero_text, widget: text }
          - { label: Gallery heading, name: gallery_heading, widget: text }
          - { label: Gallery text, name: gallery_text, widget: text }
          - label: "Gallery photos & text"
            name: dresses
            widget: list
            required: false
            summary: "{{fields.name}} — {{fields.caption}}"
            minimize_collapsed: true
            fields:
              - { label: Dress image, name: image, widget: image, required: false }
              - { label: Dress name, name: name, widget: string, required: false }
              - { label: Small caption, name: caption, widget: string, required: false }
          - { label: About heading, name: about_heading, widget: string }
          - { label: About text, name: about_text, widget: text }
          - { label: About image, name: about_image, widget: image, required: false, hint: "This controls the image beside the About text." }
          - { label: Contact heading, name: contact_heading, widget: string }
          - { label: Contact text, name: contact_text, widget: text }
